<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<!-- Il link contiene la chiave di lettura (dopo il "#"): niente referrer verso altri siti -->
<meta name="referrer" content="no-referrer" />
<meta name="robots" content="noindex, nofollow" />
<title>Shared evaluation — Supplier Trust Registry</title>
<link rel="icon" type="image/x-icon" href="favicon.ico" />
<link rel="stylesheet" href="/shared/fonts/ibm-plex/plex.css" />

<style>
  /* Stessi token del resto del sito — vedi index.html/how-it-works.html */
  :root {
    --paper: #FAFBFC;
    --blueprint: #1D5C9E;
    --blueprint-dark: #164A80;
    --powder: #E8F1FA;
    --powder-line: #C9DDF0;
    --ink: #16232E;
    --ink-soft: #52657A;
    --amber: #C77B2E;
    --amber-soft: #FBEEE0;
    --green: #2E7D4F;
    --green-soft: #E3F2E8;
    --red: #A33A2E;
    --red-soft: #F8E4E1;
    --radius: 6px;
    --font-display: 'IBM Plex Sans', sans-serif;
    --font-mono: 'IBM Plex Mono', monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-display);
    font-size: 15px;
    line-height: 1.6;
    background-image:
      linear-gradient(var(--powder-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--powder-line) 1px, transparent 1px);
    background-size: 28px 28px;
    background-attachment: fixed;
  }
  a { color: var(--blueprint); }
  header {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 20px 28px; background: rgba(250, 251, 252, 0.9);
    backdrop-filter: blur(6px); border-bottom: 1px solid var(--powder-line);
  }
  .wordmark { font-weight: 700; font-size: 17px; letter-spacing: -0.01em; }
  .wordmark span { color: var(--blueprint); }
  main { max-width: 680px; margin: 0 auto; padding: 32px 16px 100px; }
  h1 { font-size: 24px; margin: 0 0 6px; }
  .muted { color: var(--ink-soft); font-size: 13px; }
  .card {
    background: white; border: 1px solid var(--powder-line); border-radius: var(--radius);
    padding: 16px 18px; margin: 14px 0; overflow-wrap: anywhere;
  }
  .row-between { display: flex; justify-content: space-between; gap: 12px; }
  .verified {
    background: var(--green-soft); border: 1px solid var(--green); border-radius: var(--radius);
    padding: 10px 14px; font-size: 13px; color: var(--green); margin: 14px 0;
  }
  .warning-box {
    background: var(--amber-soft); border: 1px solid var(--amber); border-radius: var(--radius);
    padding: 10px 14px; font-size: 13px; color: #7A4A17; margin: 14px 0;
  }
  .error-box {
    background: var(--red-soft); border: 1px solid var(--red); border-radius: var(--radius);
    padding: 12px 14px; font-size: 14px; color: var(--red); margin: 14px 0;
  }
  .btn {
    display: inline-block; font-family: var(--font-display); font-weight: 600; font-size: 14px;
    border: 1px solid var(--blueprint); background: var(--blueprint); color: white;
    padding: 8px 16px; border-radius: var(--radius); cursor: pointer; text-decoration: none;
  }
  .btn:hover { background: var(--blueprint-dark); }
  .btn:disabled { opacity: 0.6; cursor: default; }
  @media (max-width: 520px) {
    header { padding: 14px 16px; }
    .wordmark img { height: 40px !important; width: 40px !important; vertical-align: -14px !important; }
  }
</style>
</head>
<body>

<header>
  <div class="wordmark">
    <img src="logo.png" alt="" style="height:64px; width:64px; vertical-align:-26px; margin-right:6px; border-radius:4px;" />ChainIntegrate <span>·</span> Supplier Trust Registry
  </div>
</header>

<main>
  <h1 id="page-title"></h1>
  <p class="muted" id="page-intro"></p>
  <div id="content"></div>
</main>

<script type="module" src="/js/condivisione.js"></script>
</body>
</html>
