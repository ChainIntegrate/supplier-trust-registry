<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin — Supplier Trust Registry</title>
<link rel="icon" type="image/x-icon" href="favicon.ico" />
<!-- Font serviti dal nostro dominio (repo shared-assets), nessuna richiesta a Google -->
<link rel="stylesheet" href="/shared/fonts/ibm-plex/plex.css" />

<style>
  /* Stessi token del sito pubblico (index.html) — questo e' un pannello
     per lo stesso prodotto, non un progetto a se', deve sembrare la
     stessa famiglia. */
  :root {
    --paper: #FAFBFC;
    --blueprint: #1D5C9E;
    --blueprint-dark: #164A80;
    --powder: #E8F1FA;
    --powder-line: #C9DDF0;
    --ink: #16232E;
    --ink-soft: #52657A;
    --amber: #C77B2E;
    --amber-soft: #FBEEE0;
    --radius: 6px;
    --font-display: 'IBM Plex Sans', sans-serif;
    --font-mono: 'IBM Plex Mono', monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-display);
    font-size: 15px;
    line-height: 1.5;
    background-image:
      linear-gradient(var(--powder-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--powder-line) 1px, transparent 1px);
    background-size: 28px 28px;
    background-attachment: fixed;
  }
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 20px 28px; background: rgba(250, 251, 252, 0.9);
    backdrop-filter: blur(6px); border-bottom: 1px solid var(--powder-line);
    position: sticky; top: 0; z-index: 10;
  }
  .wordmark { font-weight: 700; font-size: 17px; }
  .wordmark span { color: var(--blueprint); }
  main { max-width: 720px; margin: 0 auto; padding: 32px 20px 80px; }
  .btn {
    font-family: var(--font-display); font-weight: 600; font-size: 14px;
    border: 1px solid var(--blueprint); background: var(--blueprint); color: white;
    padding: 9px 16px; border-radius: var(--radius); cursor: pointer;
  }
  .btn:hover { background: var(--blueprint-dark); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-ghost { background: transparent; color: var(--blueprint); }
  .btn-ghost:hover { background: var(--powder); }
  .btn-danger { border-color: #B03A2E; background: transparent; color: #B03A2E; }
  .btn-danger:hover { background: #FBEAE7; }
  .card {
    background: white; border: 1px solid var(--powder-line); border-radius: var(--radius);
    padding: 20px; margin-bottom: 20px;
  }
  .card h2 { margin: 0 0 4px; font-size: 16px; }
  .card > p.muted:first-of-type { margin-top: 0; }
  .muted { color: var(--ink-soft); font-size: 13px; }
  .mono { font-family: var(--font-mono); font-size: 12px; color: var(--ink-soft); word-break: break-all; }
  input[type="text"], input[type="number"], input[type="file"], select {
    font-family: var(--font-display); font-size: 14px; padding: 8px 10px;
    border: 1px solid var(--powder-line); border-radius: var(--radius);
    width: 100%; background: white; color: var(--ink);
  }
  label { display: block; font-size: 13px; font-weight: 600; margin: 12px 0 4px; }
  label:first-child { margin-top: 0; }
  .row { display: flex; gap: 10px; align-items: center; }
  .row-between { display: flex; justify-content: space-between; align-items: center; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .divider { border: none; border-top: 1px solid var(--powder-line); margin: 16px 0; }
  .list-item { padding: 8px 0; border-top: 1px solid var(--powder-line); }
  .list-item:first-child { border-top: none; }
  .empty-state { text-align: center; padding: 40px 20px; color: var(--ink-soft); }
  .warning-box {
    background: var(--amber-soft); border: 1px solid var(--amber); border-radius: var(--radius);
    padding: 10px 12px; font-size: 13px; color: #7A4A17; margin-top: 10px;
  }
  #status-line { font-size: 13px; margin-top: 8px; min-height: 18px; }
  #status-line.error { color: #B03A2E; }
  #status-line.ok { color: #1D8A4E; }
</style>
</head>
<body>

<header>
  <div class="wordmark"><img src="logo.png" alt="" style="height:64px; width:64px; vertical-align:-26px; margin-right:6px; border-radius:4px;" />ChainIntegrate <span>·</span> Admin</div>
  <div id="wallet-area">
    <a class="btn btn-ghost" href="how-it-works.html" style="text-decoration:none; display:inline-block;">How it works</a>
    <button class="btn" id="btn-connect">Connect Universal Profile</button>
    <button class="btn btn-ghost" id="btn-logout" style="display:none;">Disconnect</button>
  </div>
</header>

<main id="app-root">
  <div class="empty-state">Connecting…</div>
</main>

<button id="btn-back-to-top" style="display:none; position:fixed; bottom:20px; right:20px; width:44px; height:44px; border-radius:50%; border:1px solid var(--powder-line); background:var(--blueprint); color:white; font-size:18px; cursor:pointer; box-shadow:0 2px 8px rgba(0,0,0,0.15); z-index:50;">↑</button>

<script src="/js/admin-abi.js"></script>
<script type="module" src="/js/admin.js"></script>

</body>
</html>
