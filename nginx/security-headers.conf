# Intestazioni di sicurezza del sito (audit S6, parte 2).
# Da includere nel blocco `server { ... }` HTTPS del sito E in ogni
# `location` che ha un proprio `add_header` (Nginx non eredita gli
# add_header del livello superiore in una location che ne definisce
# di propri). Vedi docs/OPERATIONS.md.
#
# Content-Security-Policy: il browser esegue solo codice servito da questo
# dominio (niente script inline, niente codice iniettato), si collega solo
# al sito stesso e ai due gateway IPFS, e la pagina non puo' essere
# incorporata in altri siti.
#
# Applicata (fase 2). Per tornare in sola osservazione, ad esempio per
# provare una modifica, rinominare l'intestazione in
# "Content-Security-Policy-Report-Only": il browser segnala in console
# (F12) senza bloccare.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob:; font-src 'self'; connect-src 'self' https://ipfs.chainintegrate.it https://api.universalprofile.cloud; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
