# Intestazioni di sicurezza del sito (audit S6, parte 2).
# Da includere nel blocco `server { ... }` HTTPS del sito E in ogni
# `location` che ha un proprio `add_header` (Nginx non eredita gli
# add_header del livello superiore in una location che ne definisce
# di propri). Vedi docs/OPERATIONS.md.
#
# Content-Security-Policy: il browser esegue solo codice servito da questo
# dominio (niente script inline, niente codice iniettato), si collega solo
# al sito stesso e ai due gateway IPFS, e la pagina non puo' essere
# incorporata in altri siti.
#
# FASE 1 (attuale): "-Report-Only" — il browser NON blocca nulla, segnala
# soltanto nella console (F12) cio' che avrebbe bloccato.
# FASE 2: verificata la console, togliere "-Report-Only" dal nome.
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob:; font-src 'self'; connect-src 'self' https://ipfs.chainintegrate.it https://api.universalprofile.cloud; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
